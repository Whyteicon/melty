<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MeltyBites Cakes</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="navbar">
    <div class="logo">
      <img src="images/melt.PNG" alt="MeltyBites logo" class="brand-logo">
      <div class="logo-text">
        <h1>MeltyBites</h1>
        <p>Cakes</p>
      </div>
    </div>
    <div class="nav-links">
      <a href="index.html" class="nav-link active">Home</a>
      <a href="products.html" class="nav-link">Products</a>
      <a href="custom-cake.html" class="nav-link">Custom Cakes</a>
      <div class="nav-icons">
        <a href="gallery.html" class="gallery-btn">Gallery of Past Custom Cakes</a>
        <a href="cart.html" class="cart-btn" aria-label="Open cart">
          <span class="cart-icon">🛒</span>
          <span class="cart-count">0</span>
        </a>
      </div>
    </div>
  </nav>

  <main class="hero">
    <h2>it lingers on</h2>
    <div class="carousel">
      <div class="product-container">
        <img src="" class="product left" alt="">
        <img src="" class="product center active" alt="">
        <img src="" class="product right" alt="">
      </div>
      <div class="carousel-controls">
        <button class="control-btn prev">&lt;</button>
        <button class="control-btn next">&gt;</button>
      </div>
    </div>
    <div class="background-text"></div>
  </main>

  <div class="product-popup" id="productPopup">
    <div class="popup-content">
      <div class="popup-left">
        <h1 id="popupName">SIGNATURE CAKE</h1>
        <p class="price" id="popupPrice">GHS0.00</p>
        <p class="description" id="popupDescription"></p>
        <div class="color-options">
          <span class="color-dot black active"></span>
          <span class="color-dot white"></span>
          <span class="color-dot gray"></span>
        </div>
        <div class="size-options">
          <button class="size-btn">6"</button>
          <button class="size-btn active">8"</button>
          <button class="size-btn">10"</button>
          <button class="size-btn">12"</button>
        </div>
        <button class="buy-now-btn">Buy now</button>
        <div class="slider-dots">
          <span class="dot active"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
      <div class="popup-right">
        <img src="" alt="" id="popupImage">
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
