<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeltyBites - Products</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">
      <img src="images/melt.PNG" alt="MeltyBites logo" class="brand-logo">
      <div class="logo-text">
        <h1>MeltyBites</h1>
        <p>Cakes</p>
      </div>
    </div>
    <div class="nav-links">
      <div class="nav-pills" role="navigation" aria-label="Main">
        <a href="index.html" class="nav-link nav-pill">Home</a>
        <a href="products.html" class="nav-link nav-pill active">Products</a>
        <a href="custom-cake.html" class="nav-link nav-pill">Custom</a>
      </div>
      <div class="nav-icons">
        <a href="gallery.html" class="gallery-btn" aria-label="Gallery of past custom cakes"><span class="gallery-btn-full">Past custom cakes</span><span class="gallery-btn-short" aria-hidden="true">Gallery</span></a>
        <a href="cart.html" class="cart-btn nav-cart-desktop" aria-label="Open cart">
          <span class="cart-icon">🛒</span>
          <span class="cart-count">0</span>
        </a>
      </div>
    </div>
  </nav>

  <main class="products-page">
    <h1 class="section-title">Our Cakes</h1>
    <div class="product-grid">

      <article class="product-card">
        <div class="product-image">
          <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=900&q=80" alt="Chocolate Fudge Cake">
        </div>
        <button class="quick-add-btn" data-name="CHOCOLATE FUDGE CAKE" data-price="GHS180.00" data-image="https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=900&q=80">Quick Add</button>
        <div class="product-info">
          <h3>Chocolate Fudge Cake</h3>
          <p class="price">GHS180.00</p>
        </div>
      </article>

      <article class="product-card">
        <div class="product-image">
          <img src="https://images.unsplash.com/photo-1464306076886-da185f6a9d05?auto=format&fit=crop&w=900&q=80" alt="Strawberry Bliss Cake">
        </div>
        <button class="quick-add-btn" data-name="STRAWBERRY BLISS CAKE" data-price="GHS210.00" data-image="https://images.unsplash.com/photo-1464306076886-da185f6a9d05?auto=format&fit=crop&w=900&q=80">Quick Add</button>
        <div class="product-info">
          <h3>Strawberry Bliss Cake</h3>
          <p class="price">GHS210.00</p>
        </div>
      </article>

      <article class="product-card">
        <div class="product-image">
          <img src="https://images.unsplash.com/photo-1558301211-0d8c8ddee6ec?auto=format&fit=crop&w=900&q=80" alt="Red Velvet Signature">
        </div>
        <button class="quick-add-btn" data-name="RED VELVET SIGNATURE" data-price="GHS230.00" data-image="https://images.unsplash.com/photo-1558301211-0d8c8ddee6ec?auto=format&fit=crop&w=900&q=80">Quick Add</button>
        <div class="product-info">
          <h3>Red Velvet Signature</h3>
          <p class="price">GHS230.00</p>
        </div>
      </article>

      <article class="product-card">
        <div class="product-image">
          <img src="https://images.unsplash.com/photo-1535254973040-607b474cb50d?auto=format&fit=crop&w=900&q=80" alt="Vanilla Berry Bloom">
        </div>
        <button class="quick-add-btn" data-name="VANILLA BERRY BLOOM" data-price="GHS195.00" data-image="https://images.unsplash.com/photo-1535254973040-607b474cb50d?auto=format&fit=crop&w=900&q=80">Quick Add</button>
        <div class="product-info">
          <h3>Vanilla Berry Bloom</h3>
          <p class="price">GHS195.00</p>
        </div>
      </article>

    </div>
  </main>

  <a href="cart.html" class="mobile-cart-bar" aria-label="View shopping cart">
    <span class="mobile-cart-bar__icon">🛒</span>
    <span class="mobile-cart-bar__label">Cart</span>
    <span class="cart-count mobile-cart-count">0</span>
  </a>

  <script src="script.js"></script>
</body>
</html>
